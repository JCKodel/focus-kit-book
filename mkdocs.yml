site_name: One Page at a Time
site_url: https://jckodel.github.io/focus-kit-book/
site_author: J.C. Ködel
copyright: '© 2026 J.C. Ködel · Text: <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a> · Code: <a href="https://github.com/JCKodel/focus-kit-book/blob/main/LICENSE">AGPL-3.0</a>'
docs_dir: book

validation:
  links:
    anchors: warn

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - footnotes

extra_css:
  - assets/site.css

extra:
  status:
    draft: Draft
  draft_banner: "Draft: this chapter is still being written."
  book_version: "This is version {version} of the book, published on {date}. Check https://github.com/JCKodel/focus-kit-book/releases for a newer version."
  book_version_unpublished: "This is version {version} of the book, published on {date}, with changes not yet published, built on {built}. Check https://github.com/JCKodel/focus-kit-book/releases for a newer version."

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português
          build: true
          site_name: Uma Página de Cada Vez
          copyright: '© 2026 J.C. Ködel · Texto: <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.pt-br">CC BY-SA 4.0</a> · Código: <a href="https://github.com/JCKodel/focus-kit-book/blob/main/LICENSE">AGPL-3.0</a>'
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                toggle:
                  icon: material/brightness-7
                  name: Mudar para o modo escuro
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                toggle:
                  icon: material/brightness-4
                  name: Mudar para o modo claro
          extra:
            status:
              draft: Rascunho
            draft_banner: "Rascunho: este capítulo ainda está sendo escrito."
            book_version: "Esta é a versão {version} do livro, publicada em {date}. Veja se há uma versão mais nova em https://github.com/JCKodel/focus-kit-book/releases."
            book_version_unpublished: "Esta é a versão {version} do livro, publicada em {date}, com alterações ainda não publicadas, gerada em {built}. Veja se há uma versão mais nova em https://github.com/JCKodel/focus-kit-book/releases."
